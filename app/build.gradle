apply plugin: 'com.android.application'

android {
    namespace = 'rkr.simplekeyboard.inputmethod'
    compileSdk = 34

    defaultConfig {
        applicationId = 'com.hyouka56.blackofflinekeyboard'
        minSdk = 24
        targetSdk = 34
        versionCode = 149
        versionName = '6.7-tv14'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // This module is Java-only; avoid Kotlin compiler tasks and native toolchains.
    enableKotlin = false

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
}

// Report exact deprecated Java API call sites instead of only a generic compiler note.
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
