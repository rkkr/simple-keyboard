name: Android TV 14 ARM32 APK

on:
  push:
    branches:
      - tv-android14-arm32
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv-apk:
    name: Build Android TV 14 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout TV branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses and install Android 14
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;36.0.0" "platform-tools"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify Android 14 and Java-only APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "targetSdkVersion:'34'" apk-badging.txt
          if unzip -Z1 "$APK" | grep -E '^lib/[^/]+/[^/]+\.so$'; then
            echo "Unexpected native libraries found; expected Java-only APK."
            exit 1
          fi
          echo "APK verified: $(stat -c%s "$APK") bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-keyboard-tv-android14-arm32
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
